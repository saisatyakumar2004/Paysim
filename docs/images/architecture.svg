<text x='1372' y='446' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>signals (not a</text>
<text x='1372' y='462' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>fraud detector)</text>
<rect x='30' y='590' width='1450' height='80' rx='8' fill='#f1f1f1' stroke='#7d7d7d' stroke-width='1.5'/>
<text x='42' y='612' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Monitoring: ops.* tables</text>
<text x='42' y='632' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>run_log, task_log (stage time, peak RSS, rows in/out/rejected), dq_results, dq_scores, batch_stats, recon_runs, replay_log, model_metrics</text>
<rect x='30' y='690' width='1450' height='70' rx='8' fill='#fffbe6' stroke='#b8a53a' stroke-width='1.5'/>
<text x='42' y='712' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Ground truth (synthetic only)</text>
<text x='42' y='732' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>the generator records every injected defect, so detection precision/recall is measured, not asserted; it proves the logic is coherent, not that it works on real feeds</text>
