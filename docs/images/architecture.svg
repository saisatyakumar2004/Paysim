<text x='832' y='360' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>re-check against current</text>
<text x='832' y='376' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>rules and reference data</text>
<text x='832' y='392' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>RELEASED / STILL_INVALID /</text>
<text x='832' y='408' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>SUPERSEDED (append-only log)</text>
<rect x='1080' y='100' width='230' height='300' rx='8' fill='#e8f0fa' stroke='#4a79b0' stroke-width='1.5'/>
<text x='1092' y='122' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Reconciliation engine</text>
<text x='1092' y='142' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>incremental: change-log scope</text>
<text x='1092' y='158' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>exact + constrained fuzzy match</text>
<text x='1092' y='174' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>ambiguity never guessed</text>
<text x='1092' y='190' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>sticky matches</text>
<text x='1092' y='206' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>duplicate: confirmed / suspected</text>
<text x='1092' y='222' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>match evidence table</text>
<text x='1092' y='238' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>append-only audit trail</text>
<text x='1092' y='254' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>one atomic transaction</text>
