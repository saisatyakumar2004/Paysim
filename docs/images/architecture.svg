<text x='552' y='340' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Quality gate</text>
<text x='552' y='360' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>score + any FAIL</text>
<text x='552' y='376' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>HALT = load nothing</text>
<rect x='540' y='448' width='220' height='80' rx='8' fill='#fbe9e7' stroke='#c0503f' stroke-width='1.5'/>
<text x='552' y='470' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Quarantine</text>
<text x='552' y='490' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>rejected rows + raw payload + rule ids</text>
<rect x='820' y='100' width='200' height='190' rx='8' fill='#e8f0fa' stroke='#4a79b0' stroke-width='1.5'/>
<text x='832' y='122' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Silver (DuckDB)</text>
<text x='832' y='142' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>typed, repaired, de-duplicated</text>
<text x='832' y='158' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>change-aware upserts</text>
<text x='832' y='174' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>change log</text>
<text x='832' y='190' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>SCD2 merchants</text>
<rect x='820' y='318' width='200' height='210' rx='8' fill='#fbe9e7' stroke='#c0503f' stroke-width='1.5'/>
