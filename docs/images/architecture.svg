<text x='42' y='142' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>JSON, paginated</text>
<text x='42' y='158' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>file stand-in or local HTTP API</text>
