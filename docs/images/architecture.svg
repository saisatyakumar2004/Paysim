<rect width='1500' height='800' fill='#ffffff'/>
<text x='30' y='38' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='22' font-weight='700' fill='#1b2a3a'>PayReconcile: architecture</text>
<text x='30' y='60' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b6b7f'>Every box is implemented and runs locally on DuckDB (synthetic data). Dashed = export only / documented, not a deployed service.</text>
