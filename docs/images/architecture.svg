<text x='42' y='362' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>SQLite change log</text>
<text x='42' y='378' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>watermark + overlap</text>
<rect x='30' y='430' width='200' height='92' rx='8' fill='#f4f1ea' stroke='#8a7a55' stroke-width='1.5'/>
