<text x='42' y='252' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>daily CSV, T+1 / T+2</text>
<text x='42' y='268' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>schema drift: renames, extras</text>
