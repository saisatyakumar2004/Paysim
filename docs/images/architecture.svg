<text x='42' y='472' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>weekly CSV snapshots</text>
<text x='42' y='488' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>-&gt; SCD Type 2</text>
<rect x='290' y='100' width='190' height='428' rx='8' fill='#eaf3ea' stroke='#5f8a5f' stroke-width='1.5'/>
<text x='302' y='122' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#1b2a3a'>Ingestion + Bronze</text>
<text x='302' y='142' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>retry, backoff, timeout</text>
<text x='302' y='158' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>raw values as strings</text>
<text x='302' y='174' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>Parquet by ingest_date</text>
<text x='302' y='190' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>lineage columns</text>
<text x='302' y='206' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>idempotent overwrite</text>
<rect x='540' y='100' width='220' height='190' rx='8' fill='#f8efe6' stroke='#b0763a' stroke-width='1.5'/>
