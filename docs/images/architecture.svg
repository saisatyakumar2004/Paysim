<text x='552' y='158' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>extra / renamed columns)</text>
<text x='552' y='174' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>YAML rules -&gt; SQL</text>
<text x='552' y='190' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3d4c5e'>PASS / WARNING / FAIL</text>
