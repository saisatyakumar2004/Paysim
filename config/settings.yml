# Central tunables. Every threshold is described in README.md (reconciliation, money flow) or contracts/*.yml (data quality).

reconciliation:
  amount_tolerance: 1.00        # INR; |settled - expected| <= this is MATCHED (rounding)
  settlement_sla_days: 3        # a captured txn unsettled after this many days is MISSING_SETTLEMENT
  fuzzy_max_edit_distance: 2    # max Levenshtein distance between gateway txn_id and bank reference
  duplicate_charge_window_minutes: 10

money_flow:
  fee_tolerance: 0.05           # INR; fee / net-arithmetic differences up to this are rounding, not a finding
  refund_fee_pct: 0.0           # refunds carry no fee in the bank file format (documented assumption)
  candidate_window_days: 14     # an unlinked bank record this many days after capture is still checked as a candidate
  aggregation_max_members: 3    # largest group of unsettled payments tested against one bank amount

quality:
  severity_weights: {CRITICAL: 5, ERROR: 3, WARN: 1}
  default_warn_at: 0.0          # any violation -> WARNING
  default_fail_at: 0.10         # >10% violating rows -> FAIL
  critical_fail_at: 0.02        # >2% violating rows on a CRITICAL rule -> FAIL
  gate_pass_score: 0.95         # overall >= this and no FAIL -> proceed
  gate_halt_score: 0.90         # overall < this -> halt Gold build
  volume:
    tolerance: 0.40             # +-40% vs trailing median -> WARNING
    fail_drop: 0.80             # >=80% drop -> FAIL
    min_history: 3
  distribution:
    tolerance: 0.50             # batch mean amount +-50% vs trailing median -> WARNING
    fail_ratio: 5.0             # >=5x or <=1/5x -> FAIL (unit/scale change)
    min_history: 3
  freshness:
    warn_hours: 24
    fail_hours: 48

ingestion:
  orders_overlap_days: 1        # re-read this much before the watermark to catch late updates
  api_page_size: 500
  api_max_retries: 3
  api_backoff_seconds: 0.2
  api_backoff_cap_seconds: 5.0  # upper bound for exponential backoff and for a server-supplied Retry-After
  api_timeout_seconds: 10.0     # per-request timeout for the HTTP gateway client

anomaly:
  contamination: 0.01
  min_history_days: 7

# PaySim analytics (independent of the PayReconcile pipeline above; see README).
paysim:
  source_file: PS_20174392719_1491204439457_log.csv   # relative to the repository root unless absolute; env PAYSIM_SOURCE overrides
  seed: 42
  dev_rows: 250000
  dev_fraud_fraction: 0.25      # share of each (type, fraud) stratum kept for FRAUD rows in the development sample; the rest is proportional
  balance_tolerance: 0.011      # INR; measured: consistent rows differ from the equation by <0.005 or exactly one cent of rounding
  valid_types: [CASH_IN, CASH_OUT, DEBIT, PAYMENT, TRANSFER]
  hours_per_day: 24             # `step` is one hour of the simulation
  memory_limit: 3GB
  threads: 4
  ml:
    train_end_fraction: 0.70    # temporal split on `step`: train <= 70 % of the step range
    validation_end_fraction: 0.85   # validation up to 85 %, test after
    negatives_per_positive: 20  # training only: deterministic undersampling of non-fraud rows
    random_state: 42
    rf_trees: 200
    audit_flag_auc: 0.99        # a single feature this predictive is reported as suspicious
