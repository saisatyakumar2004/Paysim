name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,dashboard,api]"
      - name: Lint
        run: ruff check .
      - name: Secrets and personal-data scan
        run: python scripts/scan_secrets.py
      - name: Data-quality and reconciliation smoke test (8 days, deterministic, no dbt)
        run: python scripts/smoke_ci.py
      - name: Unit tests (quality engine, Silver, ingestion, API, reconciliation, money flow, replay, recovery, ML leakage)
        run: pytest -q -m "not slow"
      - name: End-to-end (generate -> pipeline -> dbt build + dbt tests -> score vs ground truth incl. money flow -> failure scenarios)
        run: pytest -q -m slow
