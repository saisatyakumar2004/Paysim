version: 2

models:
  - name: dim_merchant
    description: SCD Type 2 merchant dimension (one row per version).
    columns:
      - name: merchant_sk
        data_tests: [unique, not_null]
      - name: risk_tier
        data_tests:
          - accepted_values: {arguments: {values: [low, medium, high]}}
  - name: fact_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: merchant_sk
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_merchant'), field: merchant_sk}}
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [captured, failed, pending]}}
  - name: fact_settlements
    columns:
      - name: settlement_id
        data_tests: [unique, not_null]
  - name: mart_recon_daily
    columns:
      - name: event_date
        data_tests: [unique, not_null]
  - name: mart_merchant_exceptions
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
