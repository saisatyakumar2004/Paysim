version: 2

models:
  - name: dim_merchant
    description: SCD Type 2 merchant dimension (one row per version).
    columns:
      - name: merchant_sk
        data_tests: [unique, not_null]
      - name: risk_tier
        data_tests:
          - accepted_values: {arguments: {values: [low, medium, high]}}
  - name: fact_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: merchant_sk
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_merchant'), field: merchant_sk}}
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [captured, failed, pending]}}
  - name: fact_settlements
    columns:
      - name: settlement_id
        data_tests: [unique, not_null]
  - name: fact_reconciliation
    description: One row per reconciliation item (txn, settlement or order).
    columns:
      - name: item_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [MATCHED, AMOUNT_MISMATCH, MISSING_SETTLEMENT, PENDING, ORPHAN_REFUND, ORPHAN_SETTLEMENT,
                         SETTLED_NOT_CAPTURED, SOURCE_QUARANTINED, ORDER_WITHOUT_PAYMENT, PAYMENT_QUARANTINED]
      - name: money_at_risk
        data_tests: [not_null]
  - name: mart_recon_daily
    columns:
      - name: event_date
        data_tests: [unique, not_null]
  - name: mart_merchant_exceptions
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
