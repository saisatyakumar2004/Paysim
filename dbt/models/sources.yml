version: 2

sources:
  - name: silver
    schema: silver
    description: Typed, de-duplicated rows that passed data quality (built by the Python pipeline).
    tables:
      - name: merchants_scd2
      - name: orders
        columns:
          - name: order_id
            data_tests: [unique, not_null]
      - name: gateway_txns
        columns:
          - name: txn_id
            data_tests: [unique, not_null]
          - name: amount
            data_tests: [not_null]
      - name: settlements
        columns:
          - name: settlement_id
            data_tests: [unique, not_null]
  - name: quarantine
    schema: quarantine
    tables:
      - name: rows
  - name: recon
    schema: gold
    description: Reconciliation state maintained incrementally by payreconcile.reconcile (not built by dbt).
    tables:
      - name: fact_reconciliation
        description: One row per reconciliation item (txn, settlement or order).
        columns:
          - name: item_id
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [MATCHED, AMOUNT_MISMATCH, MISSING_SETTLEMENT, PENDING, ORPHAN_REFUND, ORPHAN_SETTLEMENT,
                             SETTLED_NOT_CAPTURED, SOURCE_QUARANTINED, ORDER_WITHOUT_PAYMENT, PAYMENT_QUARANTINED]
          - name: money_at_risk
            data_tests: [not_null]
      - name: recon_links
        description: A txn can link to several bank rows (split or duplicate settlement); a bank row links to one txn.
        columns:
          - name: txn_id
            data_tests: [not_null]
          - name: settlement_id
            data_tests: [unique, not_null]
      - name: fact_money_flow
        description: One row per money chain (order -> gateway -> fee -> expected settlement -> bank), maintained by payreconcile.moneyflow.
        columns:
          - name: flow_id
            data_tests: [unique, not_null]
          - name: classification
            data_tests: [not_null]
          - name: first_breakpoint
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [NONE, ORDER, GATEWAY, PROCESSING, BANK_SETTLEMENT, MERCHANT_SETTLEMENT, SOURCE_DATA_QUALITY, MATCHING]
          - name: resolution
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [RECONCILED, IN_FLIGHT, TIMING, EXPLAINED, BLOCKED, OPEN]
          - name: exposure_amount
            data_tests: [not_null]
      - name: reconciliation_audit
        columns:
          - name: audit_id
            data_tests: [unique, not_null]
